<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174a3e">
  <meta name="referrer" content="no-referrer">
  <title>Order status | YoShop</title>
  <link rel="stylesheet" href="order-status.css">
  <script type="module" src="order-status.js"></script>
</head>
<body>
  <header class="status-header">
    <a class="status-brand" href="/" aria-label="YoShop home">Y</a>
    <span>Order tracking</span>
  </header>
  <main class="status-card">
    <p class="status-eyebrow">LIVE ORDER WORKFLOW</p>
    <h1>Your order status</h1>
    <p id="orderStatusMessage" class="status-message" role="status" aria-live="polite">Loading your order...</p>
    <div id="orderStatusContent" hidden>
      <div class="status-order-summary">
        <strong id="orderNumber">Order</strong>
        <span id="orderTable"></span>
      </div>
      <ol id="orderTimeline" class="order-timeline" aria-label="Order progress"></ol>
      <p id="orderUpdated" class="status-updated"></p>
    </div>
    <button id="refreshOrderStatus" class="status-refresh" type="button">Refresh status</button>
    <a class="status-menu-link" href="/">Back to YoShop</a>
  </main>
  <footer>Updates automatically while this page is open.</footer>
</body>
</html>
