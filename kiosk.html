<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174a3e">
  <title>Digital Menu | YoShop</title>
  <link rel="stylesheet" href="kiosk.css?v=20261106-title-price-row-v1">
  <script type="module" src="kiosk.js?v=20261106-cart-quantity-v1"></script>
</head>
<body>
  <header class="kiosk-header">
    <a class="kiosk-wordmark" href="/" aria-label="YoShop">Y</a>
    <span>Digital menu</span>
  </header>
  <main class="kiosk-layout">
    <section class="kiosk-menu-column" aria-labelledby="businessName">
      <div class="kiosk-intro">
        <p class="kiosk-kicker" id="kioskTableLabel">ORDER AT YOUR TABLE</p>
        <h1 id="businessName">Menu</h1>
        <p id="kioskMessage" role="status">Loading menu...</p>
      </div>
      <button id="kioskRetry" class="kiosk-secondary-button kiosk-retry-button" type="button" hidden>Try again</button>
      <div id="kioskPreviewNotice" class="kiosk-preview-notice" hidden>Preview mode</div>
      <div class="kiosk-menu-controls">
        <label class="kiosk-search-label" for="kioskSearch">Search the menu</label>
        <input id="kioskSearch" class="kiosk-search" type="search" placeholder="Search dishes">
        <label class="kiosk-sort-label" for="kioskSort">Sort</label>
        <select id="kioskSort" class="kiosk-sort">
          <option value="featured">Featured</option>
          <option value="name">Name A-Z</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
        </select>
      </div>
      <div id="kioskCategories" class="kiosk-categories" role="group" aria-label="Menu categories"></div>
      <div class="kiosk-menu-toolbar">
        <span id="kioskResultsCount" class="kiosk-results-count" aria-live="polite">0 items</span>
        <div class="kiosk-view-switch" role="group" aria-label="Menu layout">
          <button id="kioskListView" type="button" aria-label="List view" title="List view" aria-pressed="false">☰</button>
          <button id="kioskGridView" type="button" aria-label="Grid view" title="Grid view" aria-pressed="true">▦</button>
        </div>
      </div>
      <div id="kioskMenuItems" class="kiosk-menu-items"></div>
    </section>
    <aside class="kiosk-cart-panel" aria-labelledby="cartHeading">
      <div class="kiosk-cart-heading">
        <div>
          <p class="kiosk-kicker">YOUR SELECTION</p>
          <h2 id="cartHeading">Your order</h2>
        </div>
        <span id="kioskCartCount" class="kiosk-cart-count" aria-live="polite">0</span>
      </div>
      <div id="kioskCartItems" class="kiosk-cart-items"></div>
      <div class="kiosk-cart-total">
        <span>Subtotal</span><strong id="kioskSubtotal">$0.00</strong>
        <span>Tax</span><strong id="kioskTax">$0.00</strong>
        <span class="kiosk-total-label">Total</span><strong id="kioskTotal" class="kiosk-total-value">$0.00</strong>
      </div>
      <button id="placeKioskOrder" class="kiosk-primary-button" type="button" disabled>Place order</button>
      <button id="requestAttendant" class="kiosk-secondary-button" type="button" hidden>Request an attendant</button>
      <p class="kiosk-cart-footnote">Pay your server or cashier when your order is ready.</p>
    </aside>
  </main>
  <footer class="kiosk-footer">Powered by YoShop</footer>
</body>
</html>
