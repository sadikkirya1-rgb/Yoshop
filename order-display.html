<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10372f">
  <meta name="referrer" content="no-referrer">
  <title>Live order display | YoShop</title>
  <link rel="icon" type="image/png" href="/assets/icons/icon.png?v=20261108">
  <link rel="stylesheet" href="order-display.css?v=20261108-order-arrival-animation-v2">
  <script type="module" src="order-display.js?v=20261108-order-arrival-animation-v2"></script>
</head>
<body>
  <header class="board-header">
    <div class="board-brand"><span class="board-mark">Y</span><div><p>LIVE ORDER BOARD</p><h1 id="boardBusinessName">Order display</h1></div></div>
    <div class="board-header-actions">
      <span id="boardConnection" class="board-connection is-connecting" role="status"><span></span> Connecting</span>
      <time id="boardClock"></time>
      <label class="board-prep-target" for="boardPrepTarget">Prep target
        <select id="boardPrepTarget">
          <option value="10">10 min</option>
          <option value="15" selected>15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
        </select>
      </label>
      <button id="boardSound" type="button" aria-pressed="false">Enable alerts</button>
      <button id="boardCompact" type="button" aria-pressed="false">Compact view</button>
      <button id="boardFullscreen" type="button">Full screen</button>
    </div>
  </header>
  <main class="board-main">
    <p id="boardMessage" class="board-message" role="status" aria-live="polite">Connecting to live orders...</p>
    <div id="boardContent" hidden>
      <section class="board-summary" aria-label="Order totals by status">
        <article class="board-summary-card board-received"><span>Received</span><strong id="receivedCount">0</strong></article>
        <article class="board-summary-card board-preparing"><span>Preparing</span><strong id="preparingCount">0</strong></article>
        <article class="board-summary-card board-ready"><span>Ready</span><strong id="readyCount">0</strong></article>
        <article class="board-summary-card board-completed"><span>Completed</span><strong id="completedCount">0</strong></article>
        <article class="board-summary-card board-cancelled"><span>Cancelled</span><strong id="cancelledCount">0</strong></article>
      </section>
      <section class="board-active-section" aria-labelledby="activeOrdersHeading">
        <header class="board-section-heading"><h2 id="activeOrdersHeading">Live orders</h2><span id="activeOrdersCount">0 orders</span></header>
        <div id="boardOrders" class="board-orders"></div>
      </section>
    </div>
    <p id="boardUpdated" class="board-updated">Waiting for the first successful update.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'}).catch(error => console.warn('[ORDER DISPLAY] Offline support unavailable:', error));
    }
  </script>
</body>
</html>
