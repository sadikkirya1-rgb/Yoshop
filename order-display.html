<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10372f">
  <meta name="referrer" content="no-referrer">
  <title>Live order display | YoShop</title>
  <link rel="stylesheet" href="order-display.css?v=20261108-hide-board-scrollbars-v1">
  <script type="module" src="order-display.js?v=20261108-hide-board-scrollbars-v1"></script>
</head>
<body>
  <header class="board-header">
    <div class="board-brand"><span class="board-mark">Y</span><div><p>LIVE ORDER BOARD</p><h1 id="boardBusinessName">Order display</h1></div></div>
    <div class="board-header-actions">
      <span id="boardConnection" class="board-connection is-connecting" role="status"><span></span> Connecting</span>
      <time id="boardClock"></time>
      <label class="board-prep-target" for="boardPrepTarget">Prep target
        <select id="boardPrepTarget">
          <option value="10">10 min</option>
          <option value="15" selected>15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
        </select>
      </label>
      <button id="boardSound" type="button" aria-pressed="false">Enable alerts</button>
      <button id="boardCompact" type="button" aria-pressed="false">Compact view</button>
      <button id="boardFullscreen" type="button">Full screen</button>
    </div>
  </header>
  <main class="board-main">
    <p id="boardMessage" class="board-message" role="status" aria-live="polite">Connecting to live orders...</p>
    <div id="boardColumns" class="board-columns" hidden>
      <section class="board-column board-received" aria-labelledby="receivedHeading">
        <header><h2 id="receivedHeading">Received</h2><span id="receivedCount">0</span></header>
        <div id="receivedOrders" class="board-order-list"></div>
      </section>
      <section class="board-column board-preparing" aria-labelledby="preparingHeading">
        <header><h2 id="preparingHeading">Preparing</h2><span id="preparingCount">0</span></header>
        <div id="preparingOrders" class="board-order-list"></div>
      </section>
      <section class="board-column board-ready" aria-labelledby="readyHeading">
        <header><h2 id="readyHeading">Ready</h2><span id="readyCount">0</span></header>
        <div id="readyOrders" class="board-order-list"></div>
      </section>
      <section class="board-column board-completed" aria-labelledby="completedHeading">
        <header><h2 id="completedHeading">Completed</h2><span id="completedCount">0</span></header>
        <div id="completedOrders" class="board-order-list"></div>
      </section>
      <section class="board-column board-cancelled" aria-labelledby="cancelledHeading">
        <header><h2 id="cancelledHeading">Cancelled</h2><span id="cancelledCount">0</span></header>
        <div id="cancelledOrders" class="board-order-list"></div>
      </section>
    </div>
    <p id="boardUpdated" class="board-updated">Waiting for the first successful update.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'}).catch(error => console.warn('[ORDER DISPLAY] Offline support unavailable:', error));
    }
  </script>
</body>
</html>
